<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New Chapter • SIP Placements</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--card:#fff;--ink:#14213d;--muted:#5b6478;--gold:#c9962b;--gold2:#f0d27a;--navy:#0f1b36;--navy2:#1d2f5c;--track:#e4dfd3;--line:#eadfc6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1222;--card:#16203a;--ink:#f3efe4;--muted:#a3adc4;--track:#25314f;--line:#2a3658}}
:root[data-theme="dark"]{--bg:#0b1222;--card:#16203a;--ink:#f3efe4;--muted:#a3adc4;--track:#25314f;--line:#2a3658}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
header{position:relative;text-align:center;color:#fff;padding:64px 20px 110px;background:radial-gradient(circle at 20% 0,rgba(240,210,122,.22),transparent 45%),radial-gradient(circle at 85% 100%,rgba(201,150,43,.25),transparent 45%),linear-gradient(160deg,var(--navy),var(--navy2))}
.tag{display:inline-block;letter-spacing:.22em;font-size:.72rem;color:var(--gold2);font-weight:600;text-transform:uppercase;border:1px solid rgba(240,210,122,.5);padding:6px 14px;border-radius:99px}
h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(2.1rem,6.5vw,4rem);margin:18px 0 12px;line-height:1.1}
h1 span{background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:#c9d2e8;max-width:560px;margin:0 auto;font-size:1.05rem;line-height:1.55}
.progress{position:relative;max-width:780px;margin:-70px auto 0;padding:24px 28px;background:var(--card);border-radius:20px;box-shadow:0 18px 40px rgba(15,27,54,.18);border:1px solid var(--line);z-index:2;width:calc(100% - 32px)}
.count{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;gap:10px}
.count b{font-family:'Playfair Display',serif;font-size:3rem;line-height:1;color:var(--gold)}
.count .of{color:var(--muted);font-size:1.05rem;margin-left:6px}
.count .cheer{color:var(--muted);font-size:.9rem;text-align:right}
.track{height:20px;background:var(--track);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));background-size:200% 100%;animation:shine 3s linear infinite;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
@keyframes shine{to{background-position:-200% 0}}
.pct{color:var(--muted);font-size:.85rem;margin-top:8px;text-align:right}
main{max-width:980px;margin:0 auto;padding:10px 20px 60px}
h2{font-family:'Playfair Display',serif;text-align:center;margin:44px 0 6px;font-size:1.9rem}
.sub{text-align:center;color:var(--muted);margin:0 0 26px}
.spot{display:flex;align-items:center;gap:20px;padding:24px 26px;margin-bottom:18px;border-radius:20px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2));border:2px solid var(--gold);box-shadow:0 14px 34px rgba(201,150,43,.25);opacity:0;animation:in .7s forwards}
.spot .av{width:76px;height:76px;font-size:1.7rem;flex:none}
.spot .lbl{color:var(--gold2);font-size:.72rem;letter-spacing:.2em;font-weight:700;text-transform:uppercase}
.spot .n{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,4vw,2rem);margin:4px 0}
.spot .c{color:#c9d2e8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{display:flex;align-items:center;gap:14px;min-height:92px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 14px rgba(15,27,54,.07);opacity:0;transform:translateY(14px);animation:in .6s forwards;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(201,150,43,.22)}
.av{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--gold),#a77616);box-shadow:0 0 0 3px rgba(201,150,43,.25)}
.info{min-width:0}
.card .n{font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.card .c{display:inline-block;margin-top:5px;font-size:.78rem;font-weight:500;color:var(--gold);background:rgba(201,150,43,.12);padding:2px 10px;border-radius:99px}
@keyframes in{to{opacity:1;transform:none}}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.spot{flex-direction:column;text-align:center}.count b{font-size:2.4rem}.progress{padding:20px}}
footer{text-align:center;color:var(--muted);padding:0 20px 44px;font-size:.95rem}
.cf{position:fixed;top:-12px;width:9px;height:14px;opacity:.9;animation:fall linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style>
</head>
<body>
<header>
  <div class="tag">Congratulations, Division A</div>
  <h1>Embracing Your <span>New Chapter</span></h1>
  <p>Every name below turned months of hard work into an offer. Here's to the SIP journey and the road ahead.</p>
</header>
<section class="progress">
  <div class="count"><div><b id="num">0</b><span class="of">/ <span id="tot"></span> placed</span></div><div class="cheer" id="cheer"></div></div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="pct" id="pct"></div>
</section>
<main>
  <h2>Our Placed Stars ✨</h2>
  <div id="spot"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>Not on the list yet? Your moment is coming. Cheering for you. 💛</footer>

<script src="config.js"></script>
<script>
/* ====== EDIT HERE ======
   1. Total students in the division:  */
const TOTAL = 60;
/* 2. Placed students, in the ORDER THEY WERE PLACED (first placed at the top).
      Add each NEW placement at the BOTTOM. The website automatically shows the newest first.
      Format: ["Full Name", "Company"],   (every line needs a comma, except the last one) */
const PLACED = [
  ["Allen Sujith", "MARSH"],
  ["Shivam Dutta", "Crisil"],
  ["Yashaswitha A", "Gartner"],
  ["Harshul Vashney", "Sagility"],
  ["Prisha Aggarwal", "Sagility"],
  ["Jhanvi Baghlal", "Eli Lilly"]
];
/* 3. OPTIONAL: Google Sheet published CSV link (leave empty to use the list above). */
const SHEET_CSV_URL = (window.SIP_CONFIG && window.SIP_CONFIG.SHEET_CSV_URL) || localStorage.getItem('sip_sheet_csv_url') || "";
/* ====== END EDIT ====== */

const grid=document.getElementById('grid'),spot=document.getElementById('spot');
document.getElementById('tot').textContent=TOTAL;
let shown=-1;

function parseCSV(t){const rows=[];let r=[],f="",q=false;
for(let i=0;i<t.length;i++){const ch=t[i];
if(q){if(ch=='"'&&t[i+1]=='"'){f+='"';i++}else if(ch=='"')q=false;else f+=ch}
else if(ch=='"')q=true;else if(ch==','){r.push(f);f=""}
else if(ch=='\n'){r.push(f);rows.push(r);r=[];f=""}else if(ch!='\r')f+=ch}
if(f||r.length){r.push(f);rows.push(r)}return rows}

function confetti(){const cols=['#c9962b','#e8c468','#14213d','#d94f4f','#3a7bd5'];
for(let i=0;i<70;i++){const e=document.createElement('div');e.className='cf';
e.style.left=Math.random()*100+'vw';e.style.background=cols[i%5];
e.style.animationDuration=(2.5+Math.random()*3)+'s';e.style.animationDelay=Math.random()*1.5+'s';
document.body.appendChild(e);setTimeout(()=>e.remove(),7500)}}

function ini(name){return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function mk(cls,p,delay,label){
  const d=document.createElement('div');d.className=cls;d.style.animationDelay=delay+'s';
  d.innerHTML='<div class="av"></div><div class="info">'+(label?'<div class="lbl">'+label+'</div>':'')+'<div class="n"></div>'+(p[1]?'<div class="c"></div>':'')+'</div>';
  d.querySelector('.av').textContent=ini(p[0]);d.querySelector('.n').textContent=p[0];
  if(p[1])d.querySelector('.c').textContent=p[1];
  return d}

function render(list){
  const n=list.length;
  if(n===shown)return;
  const first=shown===-1, rev=[...list].reverse();   // newest first
  grid.innerHTML='';spot.innerHTML='';
  if(n){spot.appendChild(mk('spot',rev[0],0,'🎉 Latest placement'))}
  rev.slice(1).forEach((p,i)=>grid.appendChild(mk('card',p,first?0.2+i*0.1:0)));
  document.getElementById('pct').textContent=Math.round(n/TOTAL*100)+'% of the division placed';
  setTimeout(()=>document.getElementById('fill').style.width=(n/TOTAL*100)+'%',200);
  let c=Math.max(shown,0);const num=document.getElementById('num');
  const t=setInterval(()=>{if(c>=n){clearInterval(t);return}num.textContent=++c},n?1400/n:0);
  document.getElementById('cheer').textContent=n+' placed and counting 🎉';
  shown=n;confetti();
}

async function load(){
  if(!SHEET_CSV_URL){render(PLACED);return}
  try{
    const res=await fetch(SHEET_CSV_URL+(SHEET_CSV_URL.includes('?')?'&':'?')+'t='+Date.now());
    render(parseCSV(await res.text()).slice(1).filter(r=>r[0]&&r[0].trim()));
  }catch(e){if(shown===-1)render(PLACED)}
}
load();
if(SHEET_CSV_URL)setInterval(load,60000);
</script>
</body>
</html>
